name: Auto Unzip Source
on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/unzip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and clean up
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z"
              rm -f "$z"
            fi
          done
          rm -f .github/workflows/unzip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Extract project source files" && git push)
          
